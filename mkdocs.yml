site_name: ish — Interactive Semantic Hunt
site_description: Semantic search for code, inspired by fzf
site_url: https://davetothek.github.io/interactive-semantic-hunt/
repo_url: https://github.com/davetothek/interactive-semantic-hunt
repo_name: davetothek/interactive-semantic-hunt
edit_uri: edit/main/docs/

# A build with a broken link or a page missing from the navigation fails.
strict: true

nav:
  - Home: index.md
  - Use: usage.md
  - Clients: clients.md
  - Configure: configuration.md
  - Index: indexing.md
  - Extend: extending.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # The home page includes README.md, so the two cannot drift apart.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Queries against this repository, and the chunk that answers each.
#
# category: conceptual — a description in plain words, no identifier.
#           identifier — the name itself, as a developer would type it.
# path:     the suffix of the file that holds the answer.
# symbol:   optional, a substring of the chunk's symbol.
#
# Add a query when a ranking defect is found. Do not remove one that fails.

[[query]]
text = "fuse two rankings with reciprocal rank fusion"
category = "conceptual"
path = "application/ranking.py"
symbol = "fuse_rankings"

[[query]]

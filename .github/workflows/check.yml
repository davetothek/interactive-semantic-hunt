name: check

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # One run per branch. A newer push makes the older run pointless.
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package says it supports. A floor nobody
        # tests is a guess.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # No extras. The backends that need a compiler are optional, and
      # the tests stand in for them, so a check never builds llama.cpp.
      - run: uv sync --dev --python ${{ matrix.python }}

      - run: uv run --python ${{ matrix.python }} poe lint
      - run: uv run --python ${{ matrix.python }} poe typecheck
      - run: uv run --python ${{ matrix.python }} poe test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - run: uv build

      # A package that cannot be installed on its own is not releasable,
      # whatever the tests say.
      - name: Install the wheel by itself and run it
        run: |
          uv venv /tmp/fresh
          VIRTUAL_ENV=/tmp/fresh uv pip install dist/*.whl
          /tmp/fresh/bin/ish --version
          /tmp/fresh/bin/ish-complete "ty" .

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  version:
    # A version bump is a release, and a release is its own pull request.
    # Bundling one with the work it was cut for is what put the 0.1.1
    # bump in the same pull request as the fix it shipped.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse a version bump outside a release
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff "$BASE_SHA...HEAD" -- pyproject.toml |
               grep -q '^[+-]version = '; then
            echo "This pull request leaves the version alone."
            exit 0
          fi
          case "$HEAD_REF" in
            release/*|hotfix/*) echo "A release branch may set it."; exit 0 ;;
          esac
          case ",$LABELS," in
            *,release,*) echo "The release label says this is one."; exit 0 ;;
          esac
          echo "::error::This pull request changes the version in pyproject.toml."
          echo "A version bump belongs in its own pull request, opened once"
          echo "everything for the release already sits on main. Cut it from a"
          echo "release/X.Y.Z or hotfix/X.Y.Z branch, or add the release label."
          exit 1
